<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factores primos, M.C.D. y m.c.m.</title>
<!-- Solo para la fuente de las fórmulas (la misma familia que LaTeX en los vídeos) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6a65; --line: #dddad2;
    --accent: #2f5d8a; --radius: 14px;
    /* el «lienzo» es siempre oscuro, como los vídeos */
    --fondo: #1e1e2e; --blanco: #ffffff; --gris: #bbbbbb; --acento: #F7D96F;
    --ok: #83C167; --rosa: #FF79C6; --mal: #FC6255;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --surface: #1f1f1d; --text: #ecebe6; --muted: #a09f99; --line: #34332f; --accent: #7fb0e0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151514; --surface: #1f1f1d; --text: #ecebe6; --muted: #a09f99; --line: #34332f; --accent: #7fb0e0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         line-height: 1.5; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  .volver { color: var(--muted); text-decoration: none; font-size: 15px; }
  .volver:hover { color: var(--accent); }
  h1 { font-size: clamp(24px, 4vw, 34px); margin: 8px 0 4px; letter-spacing: -.01em; }
  .lead { color: var(--muted); margin: 0 0 20px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
           padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 14px; }
  .modos { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .modos button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 15px; padding: 6px 14px;
                  border-radius: 999px; cursor: pointer; }
  .modos button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .entrada { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .entrada input { width: 5.2em; font: inherit; font-size: 18px; padding: 6px 8px; border-radius: 8px;
                   border: 1px solid var(--line); background: var(--bg); color: var(--text); text-align: center; }
  .btn { font: inherit; font-size: 15px; padding: 7px 14px; border-radius: 10px; border: 1px solid var(--line);
         background: var(--surface); color: var(--text); cursor: pointer; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.prim { background: var(--accent); border-color: var(--accent); color: #fff; }
  .aviso { color: var(--mal); font-size: 15px; width: 100%; margin: 0; min-height: 0; }
  .aviso:empty { display: none; }

  /* ---------- Lienzo ---------- */
  .lienzo { position: relative; background: var(--fondo); color: var(--blanco); border-radius: var(--radius);
            padding: 22px clamp(14px, 3vw, 32px) 18px; overflow-x: auto; overflow-y: hidden; }
  .m { font-family: KaTeX_Main, "Latin Modern Roman", "Cambria Math", "Times New Roman", serif; }
  .t { font-family: Georgia, "Times New Roman", serif; }
  .regla-top { color: var(--gris); font-size: 16px; margin: 0 0 14px; }
  .columnas { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 18px 56px; }
  .col { display: grid; grid-template-columns: auto auto auto; align-items: center; font-size: 26px; }
  .cn { text-align: right; padding: 1px 12px 1px 6px; border-right: 2.5px solid var(--blanco); min-width: 2.6em; }
  .cp { padding: 1px 0 1px 12px; min-width: 2.4em; }
  .cm { color: var(--gris); font-size: 14px; padding-left: 8px; white-space: nowrap; }

  .bloque { margin-top: 22px; }
  .fila { font-size: 26px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 6px 0; }
  .lab, .tabla > span { white-space: nowrap; }
  sup { font-size: .62em; vertical-align: .75em; line-height: 0; }

  .pz { --c: #888; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
        border-radius: 50%; background: var(--c); border: 2px solid #fff; color: #fff; font: 700 15px/1 Georgia, serif;
        flex: none; }
  .pz.l3 { font-size: 12px; }
  .pz.vacio { visibility: hidden; }
  .tabla { display: grid; justify-content: start; align-items: center; gap: 10px 18px; font-size: 26px; margin-top: 22px; }
  .grupo { display: flex; gap: 5px; }
  .piezas { display: flex; gap: 5px; flex-wrap: wrap; }

  .regla { font-size: 18px; margin: 18px 0 2px; }
  .res { font-size: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .val { color: var(--acento); }
  .comp { color: var(--gris); font-size: 14px; margin: 2px 0 0; }

  .nota { margin: 20px 0 0; min-height: 1.6em; text-align: center; color: var(--acento); font-size: 17px; }
  .caja { position: absolute; border: 2.5px solid; border-radius: 6px; pointer-events: none;
          animation: aparece .35s ease both; }
  @keyframes aparece { from { opacity: 0; transform: scale(1.08); } }

  /* Elementos que aparecen paso a paso */
  .st { opacity: 0; transform: translateY(6px); transition: opacity .4s ease, transform .4s ease; }
  .st.on { opacity: 1; transform: none; }
  .st.late.on { transition-delay: .45s; }
  .st.later.on { transition-delay: 1.1s; }
  .instant .st, .instant .caja { transition: none !important; animation: none !important; }

  .controles { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .controles .sep { flex: 1; }
  .contador { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .ayuda { color: var(--muted); font-size: 13px; margin-top: 10px; }
  @media (max-width: 560px) {
    .col, .fila, .tabla { font-size: 20px; }
    .res { font-size: 19px; }
    .regla { font-size: 16px; }
    .cm { font-size: 12px; }
    .cn { min-width: 2.2em; }
    .columnas { gap: 14px 32px; }
    .tabla { gap: 8px 8px; }
    .grupo, .piezas { gap: 3px; }
    .pz { width: 24px; height: 24px; font-size: 11px; border-width: 1.5px; }
    .pz.l3 { font-size: 9px; }
  }
  /* Dentro de la web (?embed=1): sin cabecera, fondo transparente */
  html.embed body { background: transparent; }
  .embed .volver, .embed h1, .embed .lead { display: none; }
  .embed .wrap { padding: 0; max-width: none; }
  @media (prefers-reduced-motion: reduce) { .st { transition: none; transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="volver" href="../../../index.html#/1eso/mat">← Volver a los vídeos</a>
  <h1>Factores primos, M.C.D. y m.c.m.</h1>
  <p class="lead">Elige tus números y míralo paso a paso, como en el vídeo de divisiones sucesivas.</p>

  <div class="panel">
    <div class="modos" role="group" aria-label="Qué quieres calcular">
      <button type="button" data-modo="desc" aria-pressed="true">Descomponer</button>
      <button type="button" data-modo="mcd" aria-pressed="false">M.C.D. y m.c.m.</button>
    </div>
    <form class="entrada" id="form">
      <input id="a" type="number" inputmode="numeric" min="2" max="999" value="60" aria-label="Primer número">
      <span id="y" hidden>y</span>
      <input id="b" type="number" inputmode="numeric" min="2" max="999" value="90" aria-label="Segundo número" hidden>
      <button class="btn prim" type="submit">Empezar</button>
      <button class="btn" type="button" id="azar">🎲 Al azar</button>
    </form>
    <p class="aviso" id="aviso" role="alert"></p>
  </div>

  <div class="lienzo" id="lienzo">
    <div id="contenido"></div>
    <p class="nota t" id="nota" aria-live="polite"></p>
  </div>

  <div class="controles">
    <button class="btn" id="atras">← Atrás</button>
    <button class="btn prim" id="sig">Siguiente paso →</button>
    <button class="btn" id="play">▶ Todo seguido</button>
    <span class="sep"></span>
    <span class="contador" id="contador"></span>
    <button class="btn" id="reini">↺ Desde el principio</button>
  </div>
  <p class="ayuda">Números del 2 al 999. Con el teclado: → siguiente paso, ← atrás.</p>
</div>

<script>
"use strict";
// Mismos colores que los vídeos (estilo.py: COLOR_PRIMO y pieza)
const COLOR = { 2: "#58C4DD", 3: "#83C167", 5: "#FF862F", 7: "#9A72AC" };
const colTexto = p => COLOR[p] || "#BBBBBB";
const colPieza = p => COLOR[p] || "#888888";
const VERDE = "#83C167", ROSA = "#FF79C6";

// ---------- Matemáticas ----------
function descomponer(n) {
  const fs = [];
  for (let x = n, p = 2; x > 1;) { if (x % p === 0) { fs.push(p); x /= p; } else p++; }
  return fs;
}
function contar(fs) { const c = new Map(); fs.forEach(p => c.set(p, (c.get(p) || 0) + 1)); return c; }
function motivo(num, p) {
  if (num === p) return `${p} es primo`;
  if (p === 2) return `${num} es par`;
  if (p === 3) {
    if (num < 10) return `${num} es múltiplo de 3`;
    const d = [...String(num)].map(Number);
    return `${d.join(" + ")} = ${d.reduce((s, v) => s + v)}, múltiplo de 3`;
  }
  if (p === 5) return `${num} acaba en ${String(num).at(-1)}`;
  return `${num} : ${p} = ${num / p}`;
}
const fmt = n => n >= 10000 ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") : String(n);
const producto = c => [...c].reduce((v, [p, e]) => v * p ** e, 1);

// ---------- HTML ----------
function h(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function st(e, s, extra) { e.classList.add("st"); if (extra) e.classList.add(extra); e.dataset.s = s; return e; }
const primoHTML = p => `<span style="color:${colTexto(p)}">${p}</span>`;
function potenciasHTML(c) {
  return [...c].sort((x, y) => x[0] - y[0])
    .map(([p, e]) => `<span style="color:${colTexto(p)}">${p}${e > 1 ? `<sup>${e}</sup>` : ""}</span>`).join(" · ");
}
function pieza(p, id) {
  const e = h("span", "pz" + (String(p).length > 2 ? " l3" : ""), String(p));
  e.style.setProperty("--c", colPieza(p));
  if (id) e.id = id;
  return e;
}

// ---------- Estado ----------
let modo = "desc", pasos = 0, paso = 0, notas = [], cajas = [], timer = null;
const $ = id => document.getElementById(id);
const lienzo = $("lienzo"), contenido = $("contenido");

// Columna de divisiones sucesivas a partir del paso s0. Devuelve {g, fs, ultimo}.
function columna(n, s0) {
  const fs = descomponer(n), nums = [n];
  fs.reduce((x, p) => { nums.push(x / p); return x / p; }, n);
  const g = h("div", "col m");
  nums.forEach((num, i) => {
    g.append(st(h("div", "cn", String(num)), s0 + i, i ? "late" : null));
    if (i < fs.length) {
      const p = fs[i];
      const cp = st(h("div", "cp", String(p)), s0 + i + 1);
      cp.style.color = colTexto(p);
      g.append(cp, st(h("div", "cm t", motivo(num, p)), s0 + i + 1));
      const q = num / p;
      notas[s0 + i + 1] = [`${num} : ${p} = ${q}` + (q === 1 ? "  →  hemos llegado a 1" : ""), null];
    } else {
      g.append(h("div", "cp"), h("div", "cm"));
    }
  });
  return { g, fs, ultimo: s0 + fs.length };
}

function construirDesc(n) {
  const regla = h("p", "regla-top t", "Dividimos siempre entre el primo más pequeño posible");
  const cols = h("div", "columnas");
  const A = columna(n, 1);
  cols.append(A.g);
  notas[1] = [`Empezamos con el ${n}. ¿Entre qué primo se puede dividir?`, null];
  const c = contar(A.fs), repetidos = [...c.values()].some(e => e > 1);
  const sProd = A.ultimo + 1, sPot = repetidos ? sProd + 1 : sProd;
  const b = h("div", "bloque");
  b.append(st(h("div", "fila m", `<span class="lab">${n} =</span> ${A.fs.map(primoHTML).join(" · ")}`), sProd));
  if (repetidos) b.append(st(h("div", "fila m", `<span class="lab">${n} =</span> ${potenciasHTML(c)}`), sPot));
  const pz = h("div", "piezas");
  A.fs.forEach(p => pz.append(pieza(p)));
  b.append(st(pz, sPot, "late"));
  notas[sProd] = [A.fs.length === 1 ? `${n} es primo: solo se puede dividir entre sí mismo` :
                  "Los primos de la derecha son los factores", null];
  if (repetidos) notas[sPot] = ["Juntamos los repetidos en potencias", null];
  contenido.replaceChildren(regla, cols, b);
  return sPot;
}

function construirMcd(a, b) {
  const regla = h("p", "regla-top t", "Dividimos siempre entre el primo más pequeño posible");
  const cols = h("div", "columnas");
  const A = columna(a, 1);
  notas[1] = [`Primero descomponemos el ${a}`, null];
  const B = columna(b, A.ultimo + 1);
  notas[A.ultimo + 1] = [`Ahora el ${b}`, null];
  cols.append(A.g, B.g);

  // Tabla de piezas: cada primo en su columna
  const ca = contar(A.fs), cb = contar(B.fs);
  const primos = [...new Set([...ca.keys(), ...cb.keys()])].sort((x, y) => x - y);
  const sFil = B.ultimo + 1;
  const tabla = st(h("div", "tabla m"), sFil);
  tabla.style.gridTemplateColumns = `auto repeat(${primos.length}, auto) auto`;
  for (const [n, c, L] of [[a, ca, "A"], [b, cb, "B"]]) {
    tabla.append(h("span", "lab", `${n} =`));
    for (const p of primos) {
      const g = h("span", "grupo");
      const max = Math.max(ca.get(p) || 0, cb.get(p) || 0);
      for (let i = 0; i < max; i++) {
        const e = pieza(p, i < (c.get(p) || 0) ? `${L}-${p}-${i}` : null);
        if (i >= (c.get(p) || 0)) e.classList.add("vacio");
        g.append(e);
      }
      tabla.append(g);
    }
    tabla.append(h("span", "", "= " + potenciasHTML(c)));
  }
  notas[sFil] = ["Ponemos los factores en fila: cada primo en su columna", null];

  // M.C.D. y m.c.m.
  const mcd = new Map(), mcm = new Map();
  for (const p of primos) {
    const x = ca.get(p) || 0, y = cb.get(p) || 0;
    if (Math.min(x, y)) mcd.set(p, Math.min(x, y));
    mcm.set(p, Math.max(x, y));
  }
  const vMcd = producto(mcd), vMcm = producto(mcm);
  const bloque = h("div", "bloque");

  function resultado(nombre, c, valor, s, origen, color, regla, comp) {
    bloque.append(st(h("p", "regla t", regla), s - 1));
    bloque.lastChild.style.color = color;
    const fila = st(h("div", "res m"), s);
    fila.append(h("span", "lab", `${nombre}(${a}, ${b}) =`));
    const pz = h("span", "piezas");
    let k = 0;
    for (const [p, e] of c) for (let i = 0; i < e; i++) {
      const d = pieza(p);
      d.classList.add("fly");
      d.dataset.from = `${origen(p)}-${p}-${i}`;
      d.dataset.k = k++;
      pz.append(d);
    }
    if (k) fila.append(pz);
    const pot = potenciasHTML(c);
    const texto = !k ? `<span class="val">1</span>` :
      (String(valor) === pot ? `= <span class="val">${fmt(valor)}</span>` : `= ${pot} = <span class="val">${fmt(valor)}</span>`);
    fila.append(st(h("span", "", texto), s, "later"));
    bloque.append(fila, st(h("p", "comp t", comp), s, "later"));
  }

  const sMcd = sFil + 2, sMcm = sFil + 4;
  resultado("M.C.D.", mcd, vMcd, sMcd, () => "A", VERDE, "M.C.D. → factores COMUNES, con el MENOR exponente",
            vMcd === 1 ? `(${a} y ${b} no tienen factores comunes: son primos entre sí)` :
                         `(${vMcd} divide a ${a} y a ${b})`);
  resultado("m.c.m.", mcm, vMcm, sMcm, p => ((ca.get(p) || 0) >= (cb.get(p) || 0) ? "A" : "B"), ROSA,
            "m.c.m. → TODOS los factores, con el MAYOR exponente", `(${fmt(vMcm)} es múltiplo de ${a} y de ${b})`);

  // Recuadros (se dibujan encima, midiendo las piezas)
  const idsMcd = [], idsMcm = [];
  for (const p of primos) {
    const m = mcd.get(p) || 0;
    if (m) idsMcd.push([...Array(m).keys()].flatMap(i => [`A-${p}-${i}`, `B-${p}-${i}`]));
    const L = (ca.get(p) || 0) >= (cb.get(p) || 0) ? "A" : "B";
    idsMcm.push([...Array(mcm.get(p)).keys()].map(i => `${L}-${p}-${i}`));
  }
  cajas = [{ desde: sMcd - 1, hasta: sMcd, color: VERDE, grupos: idsMcd },
           { desde: sMcm - 1, hasta: sMcm, color: ROSA, grupos: idsMcm }];
  notas[sMcd - 1] = [mcd.size ? "Comunes: los primos que están en las dos filas, las veces que coinciden" :
                     "No hay ningún primo en las dos filas", VERDE];
  notas[sMcd] = [`M.C.D.(${a}, ${b}) = ${fmt(vMcd)}`, VERDE];
  notas[sMcm - 1] = ["Todos los primos, y de cada uno la fila que tiene más", ROSA];
  notas[sMcm] = [`m.c.m.(${a}, ${b}) = ${fmt(vMcm)}`, ROSA];

  contenido.replaceChildren(regla, cols, tabla, bloque);
  return sMcm;
}

// ---------- Mostrar un paso ----------
function volar(el) {
  const src = document.getElementById(el.dataset.from);
  if (!src) return;
  const a = src.getBoundingClientRect(), b = el.getBoundingClientRect();
  const c = src.cloneNode(true);
  c.removeAttribute("id");
  Object.assign(c.style, { position: "fixed", left: a.left + "px", top: a.top + "px", margin: 0, zIndex: 10 });
  document.body.append(c);
  el.style.visibility = "hidden";
  c.animate([{ transform: "none" }, { transform: `translate(${b.left - a.left}px, ${b.top - a.top}px)` }],
            { duration: 750, delay: 90 * +el.dataset.k, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" })
    .finished.then(() => { c.remove(); el.style.visibility = ""; });
}

function dibujarCajas(anim) {
  lienzo.querySelectorAll(".caja").forEach(e => e.remove());
  const base = lienzo.getBoundingClientRect();
  for (const cj of cajas) {
    if (paso < cj.desde || paso > cj.hasta) continue;
    for (const ids of cj.grupos) {
      const rs = ids.map(id => document.getElementById(id)?.getBoundingClientRect()).filter(Boolean);
      if (!rs.length) continue;
      const l = Math.min(...rs.map(r => r.left)) - 5, t = Math.min(...rs.map(r => r.top)) - 5;
      const r = Math.max(...rs.map(r => r.right)) + 5, bt = Math.max(...rs.map(r => r.bottom)) + 5;
      const d = h("div", "caja");
      Object.assign(d.style, { left: l - base.left + lienzo.scrollLeft + "px", top: t - base.top + "px", width: r - l + "px",
                               height: bt - t + "px", borderColor: cj.color });
      if (!anim) d.style.animation = "none";
      lienzo.append(d);
    }
  }
}

function mostrar(k, anim) {
  const antes = paso;
  paso = Math.max(1, Math.min(pasos, k));
  const avanza = anim && paso === antes + 1;
  lienzo.classList.toggle("instant", !avanza);
  let primero = null;
  for (const el of contenido.querySelectorAll(".st")) {
    const on = +el.dataset.s <= paso;
    if (on && !el.classList.contains("on") && !primero) primero = el;
    el.classList.toggle("on", on);
  }
  if (!avanza) { void lienzo.offsetHeight; requestAnimationFrame(() => lienzo.classList.remove("instant")); }
  if (avanza) {
    const vuelan = contenido.querySelectorAll(`[data-s="${paso}"] .fly, .fly[data-s="${paso}"]`);
    // primero se desplaza la página (sin animación) y luego vuelan las piezas, para que aterricen en su sitio
    if (primero) primero.scrollIntoView({ block: "nearest", behavior: vuelan.length ? "auto" : "smooth" });
    vuelan.forEach(volar);
  }
  dibujarCajas(avanza);
  const [txt, color] = notas[paso] || ["", null];
  $("nota").textContent = txt;
  $("nota").style.color = color || "";
  $("contador").textContent = `Paso ${paso} de ${pasos}`;
  $("atras").disabled = paso <= 1;
  $("sig").disabled = paso >= pasos;
  if (paso >= pasos) parar();
}

// ---------- Entrada ----------
function leer(input) {
  const v = input.value.trim();
  const n = Number(v);
  if (v === "" || !Number.isInteger(n)) return [null, "Escribe un número entero."];
  if (n === 0) return [null, "El 0 no se descompone: es múltiplo de todos los números."];
  if (n === 1) return [null, "El 1 no es primo ni compuesto: no tiene factores primos."];
  if (n < 0 || n > 999) return [null, "Elige un número del 2 al 999."];
  return [n, null];
}

function empezar() {
  parar();
  const [a, ea] = leer($("a"));
  const [b, eb] = modo === "mcd" ? leer($("b")) : [0, null];
  $("aviso").textContent = ea || eb || "";
  if (ea || eb) return;
  notas = []; cajas = []; paso = 0;
  pasos = modo === "desc" ? construirDesc(a) : construirMcd(a, b);
  mostrar(1, false);
}

function parar() { clearTimeout(timer); timer = null; $("play").textContent = "▶ Todo seguido"; }
function reproducir() {
  if (timer) return parar();
  if (paso >= pasos) mostrar(1, false);
  $("play").textContent = "⏸ Pausa";
  const tic = () => {
    mostrar(paso + 1, true);
    if (paso < pasos) timer = setTimeout(tic, contenido.querySelector(`.fly[data-s="${paso + 1}"], [data-s="${paso + 1}"] .fly`) ? 2000 : 1300);
    else parar();
  };
  timer = setTimeout(tic, 500);
}

const azar = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
function alAzar() {
  if (modo === "desc") {
    let n; do n = azar(12, 999); while (descomponer(n).length < 3);
    $("a").value = n;
  } else {
    let a, b;
    do { const g = [2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 18, 20][azar(0, 11)];
         a = g * azar(2, 20); b = g * azar(2, 20); } while (a === b || a > 999 || b > 999);
    $("a").value = a; $("b").value = b;
  }
  empezar();
}

document.querySelectorAll(".modos button").forEach(bt => bt.addEventListener("click", () => {
  modo = bt.dataset.modo;
  document.querySelectorAll(".modos button").forEach(x => x.setAttribute("aria-pressed", String(x === bt)));
  $("b").hidden = $("y").hidden = modo !== "mcd";
  if (modo === "mcd" && $("a").value === "60") { $("a").value = 12; $("b").value = 18; }
  empezar();
}));
$("form").addEventListener("submit", e => { e.preventDefault(); empezar(); });
$("azar").addEventListener("click", alAzar);
$("sig").addEventListener("click", () => { parar(); mostrar(paso + 1, true); });
$("atras").addEventListener("click", () => { parar(); mostrar(paso - 1, false); });
$("reini").addEventListener("click", () => { parar(); mostrar(1, false); });
$("play").addEventListener("click", reproducir);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") { parar(); mostrar(paso + 1, true); }
  if (e.key === "ArrowLeft") { parar(); mostrar(paso - 1, false); }
});
let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => dibujarCajas(false), 100); });

// Enlace directo: ?m=mcd&a=12&b=18&p=5  (modo, números y paso inicial)
const q = new URLSearchParams(location.search);
if (q.has("embed")) {   // dentro de la web: avisamos de la altura para que el marco se ajuste
  document.documentElement.classList.add("embed");
  const wrap = document.querySelector(".wrap");
  const avisar = () => parent.postMessage({ tipo: "altura", h: wrap.getBoundingClientRect().height + 4 }, "*");
  new ResizeObserver(avisar).observe(wrap);
  addEventListener("load", avisar);
}
if (q.get("a")) $("a").value = q.get("a");
if (q.get("b")) $("b").value = q.get("b");
const bm = document.querySelector(`.modos button[data-modo="${q.get("m") === "mcd" ? "mcd" : "desc"}"]`);
modo = bm.dataset.modo;
document.querySelectorAll(".modos button").forEach(x => x.setAttribute("aria-pressed", String(x === bm)));
$("b").hidden = $("y").hidden = modo !== "mcd";
if (modo === "mcd" && !q.get("a")) { $("a").value = 12; $("b").value = 18; }
empezar();
if (q.get("p")) mostrar(+q.get("p"), false);
</script>
</body>
</html>
