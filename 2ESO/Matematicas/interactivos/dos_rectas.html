<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dos rectas</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6a65; --line: #dddad2; --accent: #2f5d8a;
    --fondo: #1e1e2e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #151514; --surface: #1f1f1d; --text: #ecebe6; --muted: #a09f99; --line: #34332f; --accent: #7fb0e0; }
  }
  :root[data-theme="dark"] { --bg: #151514; --surface: #1f1f1d; --text: #ecebe6; --muted: #a09f99; --line: #34332f; --accent: #7fb0e0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: clamp(24px, 4vw, 32px); margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 16px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 12px; }
  .ec { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 20px "Cambria Math", "Times New Roman", serif; margin: 4px 0; }
  .ec input { width: 64px; font: inherit; padding: 2px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); text-align: center; }
  .ec .n { font: 600 14px system-ui; width: 34px; }
  .e1 .n { color: #d9822b; } .e2 .n { color: #d4479f; }
  .x { color: #c9a227; font-style: italic; } .y { color: #2b9fd6; font-style: italic; }
  .botones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button { border: 1px solid var(--line); background: none; color: var(--text); font: inherit; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  button.prim { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lienzo { background: var(--fondo); border-radius: 14px; padding: 12px; color: #fff; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 12px; align-items: center; }
  @media (max-width: 680px) { .lienzo { grid-template-columns: 1fr; } }
  svg { width: 100%; height: auto; display: block; }
  .info { font-size: 16px; }
  .tipo { font-size: 22px; font-weight: 700; margin: 4px 0; }
  .sol { font: 24px "Cambria Math", "Times New Roman", serif; margin: 8px 0; }
  .det { color: #bbb; font-size: 14px; }
  .razones { display: grid; grid-template-columns: repeat(5, auto); justify-content: start; column-gap: 10px; row-gap: 2px; align-items: center; margin: 10px 0 4px; font: 22px "Cambria Math", "Times New Roman", serif; }
  .fr { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
  .fr .num { border-bottom: 2px solid currentColor; padding: 0 4px; }
  .rel { font-weight: 700; color: #F7D96F; text-align: center; }
  .val { font: 13px system-ui, sans-serif; color: #aaa; text-align: center; }
  .rtxt { font-size: 14px; margin: 2px 0 8px; }
  .rtit { font-size: 13px; color: #aaa; margin-top: 6px; }
  html.embed body { background: transparent; }
  .embed h1, .embed .lead { display: none; }
  .embed .wrap { padding: 0; max-width: none; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1>Dos rectas</h1>
  <p class="lead">Escribe un sistema y mira sus dos rectas: la solución es el punto donde se cortan.</p>
  <div class="panel">
    <div class="ec e1"><span class="n">(1)</span><input id="a1" type="number" value="1"><span class="x">x</span> +
      <input id="b1" type="number" value="1"><span class="y">y</span> = <input id="c1" type="number" value="5"></div>
    <div class="ec e2"><span class="n">(2)</span><input id="a2" type="number" value="1"><span class="x">x</span> +
      <input id="b2" type="number" value="-1"><span class="y">y</span> = <input id="c2" type="number" value="1"></div>
    <div class="botones">
      <button id="bAzar" class="prim">🎲 Aleatorio</button>
      <button data-s="1,1,4,1,1,1">Paralelas</button>
      <button data-s="1,1,4,2,2,8">Coinciden</button>
      <button data-s="1,1,4,3,-1,1">Corte no entero</button>
      <button data-s="1,1,5,0,2,4">Con un 0</button>
    </div>
  </div>
  <div class="lienzo">
    <svg id="svg" viewBox="0 0 400 400"></svg>
    <div class="info">
      <div class="tipo" id="tipo"></div>
      <div class="rtit" id="rtit">Sin resolver: comparamos los números de la x, de la y y los sueltos</div>
      <div class="razones" id="razones"></div>
      <div class="rtxt" id="rtxt"></div>
      <div class="sol" id="sol"></div>
      <div class="det" id="det"></div>
    </div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const C1 = "#FF9F43", C2 = "#FF79C6", CX = "#F7D96F", CY = "#4FC3F7";
const R = 8, W = 400, M = 16, K = (W - 2 * M) / (2 * R);         // de −8 a 8
const px = x => M + (x + R) * K, py = y => W - M - (y + R) * K;
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
function frac(n, d) {
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d) || 1; n /= g; d /= g;
  const s = d === 1 ? `${n}` : `${n}/${d}`;
  return s.replace("-", "−");
}
function ecTxt(a, b, c) {
  let s = "";
  if (a) s += (a === 1 ? "" : a === -1 ? "−" : `${a}`.replace("-", "−")) + "x";
  if (b) s += (s ? (b > 0 ? " + " : " − ") : (b < 0 ? "−" : "")) + (Math.abs(b) === 1 ? "" : Math.abs(b)) + "y";
  return (s || "0") + " = " + `${c}`.replace("-", "−");
}
// segmento de la recta ax + by = c dentro del cuadro
function segmento(a, b, c) {
  const pts = [];
  if (b !== 0) for (const x of [-R, R]) { const y = (c - a * x) / b; if (y >= -R && y <= R) pts.push([x, y]); }
  if (a !== 0) for (const y of [-R, R]) { const x = (c - b * y) / a; if (x >= -R && x <= R) pts.push([x, y]); }
  return pts.length >= 2 ? pts.slice(0, 2) : null;
}
function dibujar() {
  const v = ["a1", "b1", "c1", "a2", "b2", "c2"].map(id => Math.round(+$("#" + id).value || 0));
  const [a1, b1, c1, a2, b2, c2] = v;
  let s = "";
  for (let i = -R; i <= R; i++) {
    s += `<line x1="${px(i)}" y1="${py(-R)}" x2="${px(i)}" y2="${py(R)}" stroke="#2c2c40" stroke-width="1"/>`;
    s += `<line x1="${px(-R)}" y1="${py(i)}" x2="${px(R)}" y2="${py(i)}" stroke="#2c2c40" stroke-width="1"/>`;
  }
  s += `<line x1="${px(-R)}" y1="${py(0)}" x2="${px(R)}" y2="${py(0)}" stroke="#999" stroke-width="1.5"/>`;
  s += `<line x1="${px(0)}" y1="${py(-R)}" x2="${px(0)}" y2="${py(R)}" stroke="#999" stroke-width="1.5"/>`;
  for (let i = -R + 2; i < R; i += 2) if (i) {
    s += `<text x="${px(i)}" y="${py(0) + 14}" fill="#888" font-size="10" text-anchor="middle">${i}</text>`;
    s += `<text x="${px(0) - 6}" y="${py(i) + 3}" fill="#888" font-size="10" text-anchor="end">${i}</text>`;
  }
  s += `<text x="${px(R) - 4}" y="${py(0) - 6}" fill="${CX}" font-size="14" font-style="italic" text-anchor="end">x</text>`;
  s += `<text x="${px(0) + 6}" y="${py(R) + 14}" fill="${CY}" font-size="14" font-style="italic">y</text>`;
  const det = a1 * b2 - a2 * b1;
  const coinciden = det === 0 && a1 * c2 === a2 * c1 && b1 * c2 === b2 * c1;
  for (const [a, b, c, col, w, dash] of [[a1, b1, c1, C1, 4, ""], [a2, b2, c2, C2, 4,coinciden ? 'stroke-dasharray="10 7"' : ""]]) {
    const p = (a || b) ? segmento(a, b, c) : null;
    if (p) s += `<line x1="${px(p[0][0])}" y1="${py(p[0][1])}" x2="${px(p[1][0])}" y2="${py(p[1][1])}" stroke="${col}" stroke-width="${w}" ${dash} stroke-linecap="round"/>`;
  }
  let tipo, col, sol = "", detTxt = "";
  if ((!a1 && !b1) || (!a2 && !b2)) {
    tipo = "Falta una incógnita"; col = "#bbb"; detTxt = "Cada ecuación necesita al menos una x o una y.";
  } else if (det !== 0) {
    const nx = c1 * b2 - c2 * b1, ny = a1 * c2 - a2 * c1;
    const x = nx / det, y = ny / det;
    tipo = "Se cortan: una solución"; col = "#7BD88F";
    sol = `<span style="color:${CX}">x</span> = ${frac(nx, det)}, &nbsp; <span style="color:${CY}">y</span> = ${frac(ny, det)}`;
    detTxt = "Compatible determinado." + (Number.isInteger(x) && Number.isInteger(y) ? " Lo puedes leer en la cuadrícula." :
      " El corte no cae en la cuadrícula: con el dibujo solo sabrías «más o menos».");
    if (Math.abs(x) <= R && Math.abs(y) <= R) {
      s += `<line x1="${px(x)}" y1="${py(y)}" x2="${px(x)}" y2="${py(0)}" stroke="#bbb" stroke-dasharray="4 4"/>`;
      s += `<line x1="${px(x)}" y1="${py(y)}" x2="${px(0)}" y2="${py(y)}" stroke="#bbb" stroke-dasharray="4 4"/>`;
      s += `<circle cx="${px(x)}" cy="${py(y)}" r="7" fill="${CX}" stroke="#1e1e2e" stroke-width="2"/>`;
    } else detTxt += " (El punto queda fuera del dibujo.)";
  } else if (coinciden) {
    tipo = "Coinciden: infinitas soluciones"; col = CX;
    detTxt = "Compatible indeterminado: una ecuación es la otra multiplicada por un número. Al reducir sale 0 = 0.";
  } else {
    tipo = "Paralelas: ninguna solución"; col = "#ff6b6b";
    detTxt = "Incompatible: las rectas nunca se cortan. Al reducir sale 0 = un número distinto de 0.";
  }
  razones(a1, b1, c1, a2, b2, c2, det, coinciden);
  $("#svg").innerHTML = s;
  $("#tipo").textContent = tipo; $("#tipo").style.color = col;
  $("#sol").innerHTML = sol;
  $("#det").innerHTML = `<div style="color:${C1}">(1) ${ecTxt(a1, b1, c1)}</div><div style="color:${C2}">(2) ${ecTxt(a2, b2, c2)}</div><p>${detTxt}</p>`;
  avisar();
}
const menos = n => `${n}`.replace("-", "−");
function fracHTML(n, d, col, apagado) {
  return `<div class="fr" style="color:${col};opacity:${apagado ? 0.3 : 1}"><span class="num">${menos(n)}</span><span>${menos(d)}</span></div>`;
}
function valHTML(n, d, apagado) {
  if (apagado) return `<div class="val"></div>`;
  return d === 0 ? `<div class="val" style="color:#ff6b6b">÷ 0 ✗</div>` : `<div class="val">= ${frac(n, d)}</div>`;
}
// criterio de las proporciones: a1/a2, b1/b2, c1/c2 (y en cruz si hay un 0 abajo)
function razones(a1, b1, c1, a2, b2, c2, det, coinciden) {
  const caja = $("#razones"), txt = $("#rtxt");
  if ((!a1 && !b1) || (!a2 && !b2)) { caja.innerHTML = ""; txt.innerHTML = ""; $("#rtit").style.display = "none"; return; }
  $("#rtit").style.display = "";
  const igualAB = det === 0, sinC = !igualAB;
  const r1 = igualAB ? "=" : "≠", r2 = sinC ? "" : (coinciden ? "=" : "≠");
  caja.innerHTML =
    fracHTML(a1, a2, CX, false) + `<div class="rel">${r1}</div>` + fracHTML(b1, b2, CY, false) +
    `<div class="rel">${r2}</div>` + fracHTML(c1, c2, "#fff", sinC) +
    valHTML(a1, a2, false) + "<div></div>" + valHTML(b1, b2, false) + "<div></div>" + valHTML(c1, c2, sinC);
  let t;
  if (sinC) t = `<span style="color:#7BD88F">Las de la x y la y ya son distintas: no hace falta mirar la tercera → <b>una solución</b>.</span>`;
  else if (!coinciden) t = `<span style="color:#ff6b6b">x e y en la misma proporción, los números sueltos no → <b>paralelas</b>.</span>`;
  else t = `<span style="color:${CX}">Las tres en la misma proporción: una ecuación es la otra multiplicada → <b>la misma recta</b>.</span>`;
  const cero = a2 === 0 || b2 === 0 || (!sinC && c2 === 0);
  if (cero) {
    const p1 = a1 * b2, p2 = a2 * b1;
    let c = `<br><span style="color:#bbb">Hay un 0 abajo y no se puede dividir: multiplicamos en cruz.<br>` +
      `a₁·b₂ = ${menos(a1)}·${menos(b2)} = ${menos(p1)} &nbsp; a₂·b₁ = ${menos(a2)}·${menos(b1)} = ${menos(p2)} → ${p1 === p2 ? "iguales" : "distintos"}`;
    if (!sinC) {
      const usaA = a1 || a2;
      const [u1, u2, n1, n2] = usaA ? [a1, a2, "a", "a"] : [b1, b2, "b", "b"];
      const q1 = u1 * c2, q2 = u2 * c1;
      c += `<br>${n1}₁·c₂ = ${menos(q1)} &nbsp; ${n2}₂·c₁ = ${menos(q2)} → ${q1 === q2 ? "iguales" : "distintos"}`;
    }
    t += c + "</span>";
  }
  txt.innerHTML = t;
}
const azar = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function aleatorio() {
  const t = Math.random();
  let v;
  if (t < 0.75) {                      // solución entera (x0, y0)
    const x0 = azar(-4, 5), y0 = azar(-4, 5);
    let a1, b1, a2, b2;
    do { a1 = azar(-3, 3); b1 = azar(-3, 3); a2 = azar(-3, 3); b2 = azar(-3, 3); } while (a1 * b2 - a2 * b1 === 0 || !a1 && !b1 || !a2 && !b2);
    v = [a1, b1, a1 * x0 + b1 * y0, a2, b2, a2 * x0 + b2 * y0];
  } else if (t < 0.88) {               // paralelas
    const a = azar(1, 3), b = azar(-3, 3) || 1, k = azar(2, 3), c = azar(-5, 5);
    v = [a, b, c, a * k, b * k, c * k + azar(1, 4)];
  } else {                              // coinciden
    const a = azar(1, 3), b = azar(-3, 3) || 1, k = azar(2, 3), c = azar(-5, 5);
    v = [a, b, c, a * k, b * k, c * k];
  }
  ["a1", "b1", "c1", "a2", "b2", "c2"].forEach((id, i) => $("#" + id).value = v[i]);
  dibujar();
}
let avisar = () => {};
const q = new URLSearchParams(location.search);
["a1", "b1", "c1", "a2", "b2", "c2"].forEach(id => { if (q.has(id)) $("#" + id).value = q.get(id); $("#" + id).oninput = dibujar; });
if (q.has("embed")) {
  document.documentElement.classList.add("embed");
  avisar = () => parent.postMessage({ tipo: "altura", h: $("#wrap").getBoundingClientRect().height + 4 }, "*");
  addEventListener("resize", avisar);
}
$("#bAzar").onclick = aleatorio;
document.querySelectorAll("button[data-s]").forEach(b => b.onclick = () => {
  b.dataset.s.split(",").forEach((n, i) => $("#" + ["a1", "b1", "c1", "a2", "b2", "c2"][i]).value = n);
  dibujar();
});
dibujar();
</script>
</body>
</html>
