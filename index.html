<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vídeos de clase</title>
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #efede7;
    --text: #1d1d1b;
    --muted: #6b6a65;
    --line: #dddad2;
    --accent: #2f5d8a;
    --mat: #2f5d8a;
    --fq: #b4532a;
    --bg-geo: #3c7a4a;
    --geo-his: #8a6420;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
    --cuadricula: rgba(47,93,138,.08);
    --formula: rgba(47,93,138,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --surface: #1f1f1d;
      --surface-2: #2a2a27;
      --text: #ecebe6;
      --muted: #a09f99;
      --line: #34332f;
      --accent: #7fb0e0;
      --mat: #7fb0e0;
      --fq: #e8916a;
      --bg-geo: #7fc28e;
      --geo-his: #d9b36a;
      --shadow: none;
      --cuadricula: rgba(127,176,224,.06);
      --formula: rgba(127,176,224,.16);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 32px 20px 64px; }

  /* Fondo de cuadrícula de libreta en Matemáticas */
  body[data-asig="mat"] {
    background-image:
      linear-gradient(var(--cuadricula) 1px, transparent 1px),
      linear-gradient(90deg, var(--cuadricula) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: center top;
  }

  /* Fórmulas decorativas en los márgenes (solo pantallas anchas, solo Matemáticas) */
  .formulas { display: none; position: fixed; inset: 0; z-index: -1; pointer-events: none; color: var(--formula); }
  @media (min-width: 1700px) { body[data-asig="mat"] .formulas { display: block; } }
  .formulas span { position: absolute; transform: translate(-50%, -50%) rotate(var(--r)); }
  .formulas span.izq { left: calc((100vw - 1440px) / 4); }
  .formulas span.der { left: calc(100vw - (100vw - 1440px) / 4); }
  .formulas svg { display: block; height: var(--h); width: auto; max-width: calc((100vw - 1440px) / 2 - 40px); }
  header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 15px; color: var(--muted); }
  .crumbs a { color: var(--muted); text-decoration: none; }
  .crumbs a:hover { color: var(--text); text-decoration: underline; }
  .crumbs .sep { opacity: .5; }
  .crumbs .here { color: var(--text); font-weight: 600; }

  h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.01em; }
  .lead { color: var(--muted); margin: 0 0 32px; font-size: 17px; }
  h2.group { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 28px 0 12px; font-weight: 600; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .card {
    display: block; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px 20px; box-shadow: var(--shadow);
    transition: transform .15s ease, border-color .15s ease;
    position: relative; overflow: hidden;
  }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--c, var(--accent)); outline: none; }
  .card .big { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .card .sub { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .card .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c, var(--accent)); }
  .card .name { font-size: 20px; font-weight: 650; line-height: 1.25; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); margin-top: 12px; }
  .pill.on { background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); font-weight: 600; }
  /* Tarjeta de asignatura con su mascota a la derecha */
  .card.con-img { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 14px 14px 22px; min-height: 150px; }
  .card.con-img .info { min-width: 0; }
  .grid.asigs { grid-template-columns: repeat(auto-fill, minmax(min(100%, 310px), 1fr)); }
  .card.con-img img { height: 120px; width: auto; flex: none; transition: transform .2s ease; }
  .card.con-img:hover img { transform: rotate(-4deg) scale(1.05); }

  /* Player */
  .player { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .player { grid-template-columns: 1fr; } }
  .stage { background: #000; border-radius: var(--radius); overflow: hidden; aspect-ratio: 16 / 9; }
  .stage video { width: 100%; height: 100%; display: block; background: #000; }
  /* Actividades interactivas (tipo: "web"): la página va dentro del reproductor y ajusta su altura */
  .stage.web { aspect-ratio: auto; background: transparent; border-radius: 0; }
  .stage iframe { width: 100%; height: 80vh; border: 0; display: block; background: transparent; }
  .now { margin-top: 14px; }
  .now .t { font-size: 22px; font-weight: 650; margin: 0; }
  .now .m { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
  .controls { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 10px; cursor: pointer;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .btn:hover:not(:disabled) { border-color: var(--c, var(--accent)); }
  .controls .sep { flex: 1; }
  button.btn:disabled { opacity: .4; cursor: default; }

  .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .list summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 600; user-select: none;
  }
  .list summary::-webkit-details-marker { display: none; }
  .list summary:hover { background: var(--surface-2); color: var(--text); }
  .list summary:focus-visible { outline: 2px solid var(--c); outline-offset: -2px; }
  .list summary .tt { flex: 1; line-height: 1.35; }
  .list summary .cnt {
    font-size: 12px; text-transform: none; letter-spacing: 0; font-weight: 500;
    padding: 1px 8px; border-radius: 99px; background: var(--surface-2); white-space: nowrap;
  }
  .list summary .chev { width: 10px; height: 10px; flex: none; border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s ease; }
  .list details[open] > summary { color: var(--text); }
  .list details[open] > summary .chev { transform: rotate(45deg); }
  .list details.has-active > summary .tt { color: var(--c); }
  .list ol { list-style: none; margin: 0; padding: 0 0 8px; }
  .list li button {
    all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 12px; align-items: baseline;
    width: 100%; padding: 9px 16px; font-size: 15px;
  }
  .list li button:hover { background: var(--surface-2); }
  .list li button:focus-visible { outline: 2px solid var(--c); outline-offset: -2px; }
  .list li button .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.6em; font-size: 13px; }
  .list li button .n.x { color: var(--c, var(--accent)); font-weight: 600; }
  .list li button.active { background: color-mix(in srgb, var(--c) 14%, transparent); font-weight: 600; }
  .list li button.active .n { color: var(--c); }
  .list .topic + .topic { border-top: 1px solid var(--line); }

  /* Cabecera con mascota del curso */
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .hero .txt { min-width: 0; }
  .mascota { display: flex; align-items: center; gap: 12px; flex: none; margin: -24px 0 -8px; }
  .mascota img { height: 150px; width: auto; display: block; }
  .bocadillo {
    position: relative; max-width: 220px; padding: 9px 14px; font-size: 14px; line-height: 1.35;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  }
  .bocadillo::after {
    content: ""; position: absolute; right: -7px; top: 50%; width: 12px; height: 12px;
    background: var(--surface); border-right: 1px solid var(--line); border-top: 1px solid var(--line);
    transform: translateY(-50%) rotate(45deg);
  }
  @media (max-width: 600px) {
    .mascota { margin: 0; }
    .mascota img { height: 90px; }
    .bocadillo { display: none; }
  }

  .empty {
    background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius);
    padding: 48px 24px; text-align: center; color: var(--muted);
  }
  .empty strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }
</style>
</head>

/* ====================================================== */

const app = document.getElementById("app");
const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const count = (key) => (VIDEOS[key] || []).reduce((n, t) => n + t.videos.filter(v => v.tipo !== "web").length, 0);
const plural = (n) => n === 1 ? "1 vídeo" : n + " vídeos";
const asignaturasDe = (curso) => curso.asignaturas
  ? curso.asignaturas.map(id => ASIGNATURAS.find(a => a.id === id)) : ASIGNATURAS;

function crumbs(parts) {
  const items = [`<a href="#/">Inicio</a>`];
  parts.forEach((p, i) => {
    items.push(`<span class="sep">›</span>`);
    items.push(i === parts.length - 1 ? `<span class="here">${esc(p.label)}</span>` : `<a href="${p.href}">${esc(p.label)}</a>`);
  });
  return `<header class="top"><nav class="crumbs" aria-label="Ruta">${items.join("")}</nav></header>`;
}

// Título + subtítulo, con la mascota del curso a la derecha si la tiene
function hero(titulo, lead, curso, frase, color, img) {
  const txt = `<div class="txt"><h1${color ? ` style="--c:${color}"` : ""}>${esc(titulo)}</h1><p class="lead">${esc(lead)}</p></div>`;
  img = img || curso.mascota;
  if (!img) return txt;
  return `<div class="hero">${txt}
    <div class="mascota"><div class="bocadillo">${esc(frase)}</div>
      <img src="${img}" alt="Mascota de ${esc(curso.nombre)}: un ajolote"></div>
  </div>`;
}

function viewHome() {
  document.title = "Vídeos de clase";
  const grupo = (etapa) => CURSOS.filter(c => c.etapa === etapa).map(c => {
    const n = asignaturasDe(c).reduce((s, a) => s + count(c.id + "/" + a.id), 0);
    return `<a class="card" href="#/${c.id}">
      <div class="big">${c.corto}</div>
      <div class="sub">${esc(c.nombre)}</div>
      <span class="pill ${n ? "on" : ""}" style="--c:var(--accent)">${n ? plural(n) : "Sin vídeos aún"}</span>
    </a>`;
  }).join("");
  app.replaceChildren(el(`
    <h1>Curso escolar</h1>
    <p class="lead">Elige tu curso para ver los vídeos de cada asignatura.</p>
    <h2 class="group">ESO</h2><div class="grid">${grupo("ESO")}</div>
    <h2 class="group">Bachillerato</h2><div class="grid">${grupo("Bachillerato")}</div>
  `));
}

function viewCurso(curso) {
  document.title = curso.nombre;
  const cards = asignaturasDe(curso).map(a => {
    const n = count(curso.id + "/" + a.id);
    const img = (curso.mascotas || {})[a.id];
    return `<a class="card${img ? " con-img" : ""}" href="#/${curso.id}/${a.id}" style="--c:${a.color}">
      <span class="bar"></span>
      <div class="info"><div class="name">${esc(a.nombre)}</div>
      <span class="pill ${n ? "on" : ""}">${n ? plural(n) : "Próximamente"}</span></div>
      ${img ? `<img src="${img}" alt="" loading="lazy">` : ""}
    </a>`;
  }).join("");
  app.replaceChildren(el(`
    ${crumbs([{ label: curso.nombre }])}
    ${hero(curso.nombre, "Asignaturas", curso, "¡Hola! Elige una asignatura para empezar.")}
    <div class="grid asigs">${cards}</div>
  `));
}

function viewAsignatura(curso, asig, startIndex) {
  document.title = asig.nombre + " · " + curso.nombre;
  const key = curso.id + "/" + asig.id;
  const temas = VIDEOS[key] || [];
  const head = `${crumbs([{ label: curso.nombre, href: "#/" + curso.id }, { label: asig.nombre }])}
    ${hero(asig.nombre, curso.nombre, curso, "¡Hola! ¿Qué vemos hoy?", asig.color, (curso.mascotas || {})[asig.id])}`;

  if (!temas.length) {
    app.replaceChildren(el(`${head}
      <div class="empty"><strong>Todavía no hay vídeos</strong>Los vídeos de esta asignatura se añadirán más adelante.</div>`));
    return;
  }

  // Los vídeos extra (v.extra = "E1"...) llevan su etiqueta y no cuentan en la numeración del tema
  const flat = [];
  temas.forEach((t, ti) => {
    let n = 0;
    t.normales = t.videos.filter(v => !v.extra).length;
    t.extras = t.videos.length - t.normales;
    t.videos.forEach(v => { v.n = v.extra || ++n;
      flat.push({ ...v, tema: t.tema, t: ti, local: v.n, total: t.normales }); });
  });

  // Acordeón: un <details> por tema; name="temas" deja solo uno abierto a la vez
  let idx = 0;
  const lista = temas.map((t, ti) => `<details class="topic" name="temas" data-t="${ti}">
      <summary><span class="chev" aria-hidden="true"></span><span class="tt">${esc(t.tema)}</span>
        <span class="cnt">${plural(t.normales)}${t.extras ? ` + ${t.extras} extra` : ""}</span></summary>
      <ol>${t.videos.map((v, vi) => { const i = idx++;
        return `<li><button data-i="${i}"><span class="n${v.extra ? " x" : ""}">${v.n}</span><span>${esc(v.titulo)}</span></button></li>`;
      }).join("")}</ol>
    </details>`).join("");

  app.replaceChildren(el(`${head}
    <div class="player" style="--c:${asig.color}">
      <div>
        <div class="stage" id="stage"><video id="vid" controls playsinline preload="metadata"></video>
          <iframe id="web" hidden title="Actividad interactiva"></iframe></div>
        <div class="now"><p class="t" id="vt"></p><p class="m" id="vm"></p></div>
        <div class="controls">
          <button class="btn" id="prev">← Anterior</button>
          <button class="btn" id="next">Siguiente →</button>
          <span class="sep"></span>
          <a class="btn" id="dl-vid" download>⬇ Descargar vídeo</a>
          <a class="btn" id="dl-py" download title="Código Manim de todo el tema (necesita estilo.py)">⬇ Código Python</a>
          <a class="btn" id="abrir" target="_blank" rel="noopener" hidden>↗ Abrir en pantalla completa</a>
        </div>
      </div>
      <aside class="list">${lista}</aside>
    </div>`));

  const vid = document.getElementById("vid");
  const buttons = [...app.querySelectorAll(".list button")];
  let cur = -1;

  function load(i, autoplay) {
    i = Math.max(0, Math.min(flat.length - 1, i));
    cur = i;
    const v = flat[i];
    const web = v.tipo === "web", marco = document.getElementById("web");
    document.getElementById("stage").classList.toggle("web", web);
    vid.hidden = web; marco.hidden = !web;
    ["dl-vid", "dl-py"].forEach(id => document.getElementById(id).hidden = web);
    document.getElementById("abrir").hidden = !web;
    if (web) {
      vid.pause(); vid.removeAttribute("src"); vid.load();
      marco.src = encodeURI(v.src) + (v.src.includes("?") ? "&" : "?") + "embed=1";
      document.getElementById("abrir").href = encodeURI(v.src);
    } else {
      if (marco.getAttribute("src")) marco.removeAttribute("src");
      vid.src = encodeURI(v.src);
    }
    // .../videos/tNN_tema/N.Escena.mp4  ->  .../codigo/tNN_tema.py
    const partes = v.src.split("/");
    const py = [...partes.slice(0, -3), "codigo", partes.at(-2) + ".py"].join("/");
    const dv = document.getElementById("dl-vid"), dp = document.getElementById("dl-py");
    dv.href = encodeURI(v.src);
    dv.download = `${partes.at(-2)}_${partes.at(-1)}`;
    dp.href = encodeURI(py);
    dp.download = partes.at(-2) + ".py";
    document.getElementById("vt").textContent = v.titulo;
    document.getElementById("vm").textContent = web ? `${v.tema} · actividad interactiva (${v.extra})`
                                              : v.extra ? `${v.tema} · vídeo extra (${v.extra})`
                                                          : `${v.tema} · vídeo ${v.local} de ${v.total}`;
    buttons.forEach(b => b.classList.toggle("active", +b.dataset.i === i));
    app.querySelectorAll(".list details").forEach(d => {
      const mine = +d.dataset.t === v.t;
      d.classList.toggle("has-active", mine);
      if (mine) d.open = true;  // abre el tema del vídeo actual
    });
    document.getElementById("prev").disabled = i === 0;
    document.getElementById("next").disabled = i === flat.length - 1;
    history.replaceState(null, "", `#/${curso.id}/${asig.id}/${i + 1}`);
    if (autoplay && !web) vid.play().catch(() => {});
  }

  buttons.forEach(b => b.addEventListener("click", () => load(+b.dataset.i, true)));
  document.getElementById("prev").addEventListener("click", () => load(cur - 1, true));
  document.getElementById("next").addEventListener("click", () => load(cur + 1, true));
  vid.addEventListener("ended", () => { if (cur < flat.length - 1) load(cur + 1, true); });

  load(startIndex, false);
}

// Las actividades interactivas (dentro de un iframe) nos dicen cuánto miden
addEventListener("message", (e) => {
  const marco = document.getElementById("web");
  if (marco && e.source === marco.contentWindow && e.data && e.data.tipo === "altura")
    marco.style.height = Math.ceil(e.data.h) + "px";
});

function route() {
  const [c, a, n] = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const curso = CURSOS.find(x => x.id === c);
  const asig = curso && asignaturasDe(curso).find(x => x.id === a);
  document.body.dataset.asig = curso && asig ? asig.id : "";
  if (curso && asig) viewAsignatura(curso, asig, Math.max(0, (parseInt(n, 10) || 1) - 1));
  else if (curso) viewCurso(curso);
  else viewHome();
  window.scrollTo(0, 0);
}

// Fórmulas del fondo: [lado, altura en % de la ventana, alto en px, giro en grados], una por fórmula
const POS_FORMULAS = [
  ["izq", 18, 56, -6], ["der", 24, 52, 5],  ["izq", 44, 26, 4],  ["der", 50, 24, -4],
  ["izq", 66, 30, -3], ["der", 74, 26, 6],  ["izq", 86, 50, 5],  ["der", 92, 26, -5],
];
document.getElementById("formulas").innerHTML = (window.FORMULAS || []).map((svg, i) => {
  const [lado, top, h, r] = POS_FORMULAS[i % POS_FORMULAS.length];
  return `<span class="${lado}" style="top:${top}%;--h:${h}px;--r:${r}deg">${svg}</span>`;
}).join("");

window.addEventListener("hashchange", route);
route();
</script>
